<!doctype html>
<!-- مرجع بنك الأسئلة الأكاديمي: واجهة مواد وملفات هاتفية مبسطة بلا مكونات إضافية. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4d65ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="مكتبة الصف التاسع">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/aqb9-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/aqb9-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/performance.css">
  <link rel="stylesheet" href="assets/reference-ui.css">
  <link rel="stylesheet" href="assets/files-edge-to-edge.css">
  <link rel="stylesheet" href="assets/home-edge-cards.css">
  <link rel="stylesheet" href="assets/touch-neutral.css">
  <link rel="stylesheet" href="assets/access-code-sheet.css">
  <link rel="stylesheet" href="assets/app-theme.css">
  <title>مكتبة التاسع</title>
</head>
<body class="reference-page">
  <main class="reference-shell">
    <header class="reference-header">
      <a class="reference-brand" href="./" aria-label="مكتبة التاسع"><img src="assets/aqb9-logo.webp" alt="رمز مكتبة التاسع"><span><b>مكتبة التاسع</b><small>القسم المميز</small></span></a>
      <span id="theme-button" hidden aria-hidden="true"></span>
    </header>
    <div id="sync-status" class="sync-status" role="status" aria-live="polite" hidden></div>

    <section class="reference-hero" id="reference-hero">
      <span class="reference-hero-icon">▤</span>
      <div><h1 id="hero-title">الصف التاسع</h1><p id="hero-subtitle">اختر المادة لعرض الملفات</p></div>
      <span class="reference-hero-arrow">←</span>
    </section>

    <button class="reference-global-code" id="open-global-code"><span class="reference-global-icon">◎</span><span><b>تفعيل كود الوصول الشامل</b><small>كود واحد يفتح جميع ملفات الصف التاسع</small></span><i>←</i></button>

    <div id="app-status" class="reference-status">جارٍ تحميل المحتوى…</div>
    <section id="subjects-list" class="reference-list" hidden></section>
    <section id="files-list" class="reference-list" hidden></section>
  </main>

  <dialog class="access-dialog" id="code-dialog" aria-labelledby="code-target" aria-describedby="code-dialog-description">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="close-dialog" id="close-code-dialog" aria-label="إغلاق نافذة كود الوصول">×</button>
    <div class="access-dialog-content">
      <div class="dialog-copy"><span class="dialog-eyebrow">دخول محمي</span><h2 id="code-target">كود الوصول الشامل</h2><p id="code-dialog-description">يفتح جميع ملفات الصف التاسع</p></div>
      <div class="dialog-mark" aria-hidden="true"><span>◎</span></div>
      <form id="code-form">
        <label class="sr-only" for="access-code">كود الوصول</label>
        <div class="access-code-input"><span aria-hidden="true">⌘</span><input id="access-code" placeholder="AQB9-XXXXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" required></div>
        <small class="form-error" id="code-error" aria-live="polite"></small>
        <button class="primary-button full-width" type="submit" id="verify-code">تفعيل الوصول <span aria-hidden="true">◎</span></button>
      </form>
      <a class="code-contact" id="code-contact" href="#" hidden target="_blank" rel="noopener"><span class="code-contact-copy"><b id="code-contact-title">لشراء كود الوصول</b><small id="code-contact-price"></small></span><span class="code-contact-action">تواصل <i aria-hidden="true">◌</i></span></a>
    </div>
  </dialog>
  <script src="assets/protection.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/app-theme.js"></script>
</body>
</html>
